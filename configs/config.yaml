# Configuration for Mental Health Audio Diffusion Model

# Data parameters
data:
  target_sr: 16000
  n_fft: 1024
  hop_length: 512
  n_mels: 80
  max_audio_length: 10  # seconds
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# Model parameters
model:
  # Semantic Encoder
  encoder:
    input_dim: 6373  # Will be auto-calculated based on features
    latent_dim: 256
    hidden_dims: [512, 384]
    dropout: 0.1
  
  # Diffusion Model
  diffusion:
    in_channels: 1
    condition_dim: 256
    time_dim: 256
    base_channels: 64
    num_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
  
  # Classifier
  classifier:
    num_classes: 3  # Depression, Anxiety, Distress
    dropout: 0.5

# Training parameters
training:
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip: 1.0
  checkpoint_interval: 10
  log_interval: 100
  num_workers: 4
  
# Paths
paths:
  data_dir: "./data"
  checkpoint_dir: "./checkpoints"
  output_dir: "./outputs"
  log_dir: "./logs"

# Device
device: "cuda"  # or "cpu"

# Feature extraction
features:
  use_wav2vec: true
  use_hubert: false
  use_opensmile: true
  wav2vec_model: "facebook/wav2vec2-base"
  hubert_model: "facebook/hubert-base-ls960"