device: "cuda"

paths:
  data_dir: "./data"
  audio_subdir: "audio"
  feature_subdir: "features"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  checkpoint_interval: 5
  num_workers: 0

semantic_mapping:
  feature_type: "egemaps"  # egemaps or mfcc
  architecture: "spectrogram_semcom"  # spectrogram_semcom, cnn, cnn_lstm, transformer
  input_representation: "spectrogram"  # spectrogram (default) or waveform
  target_sr: 16000
  frame_size_ms: 25.0
  hop_size_ms: 10.0
  n_mels: 64
  spectrogram_patch_frames: 5
  spectrogram_n_fft: null
  normalize_features: true
  cache_dir: "./cache"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  latent_dim: 64
  channel_noise_std: 0.0
  interpolation_scale: 1.0
  denoiser_channels: 64
